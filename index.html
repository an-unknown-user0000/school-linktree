<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校內資訊連結</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body { font-family: sans-serif; text-align: center; padding: 40px 20px; background: #f5f5f5; }
  #login-box { margin-top: 100px; }
  #content { display: none; max-width: 400px; margin: 0 auto; }
  .link-btn { display: block; background: white; padding: 16px; margin: 12px 0; border-radius: 12px; text-decoration: none; color: #333; box-shadow: 0 2px 6px rgba(0,0,0,0.1); font-weight: bold; }
  #denied { display: none; color: #d33; margin-top: 30px; }
</style>
</head>
<body>

<div id="login-box">
  <h2>校內資訊連結</h2>
  <p>請使用學校 Google 帳號登入</p>
  <div id="g_id_onload"
       data-client_id="708188694689-s39e3qokip8sc1gtskik0gp8334cp02q.apps.googleusercontent.com"
       data-callback="handleLogin">
  </div>
  <div class="g_id_signin" data-type="standard"></div>
</div>

<div id="denied">
  ⚠️ 僅限校內帳號使用，請確認你使用的是學校信箱登入
</div>

<div id="content">
  <h2>歡迎！</h2>
  <a class="link-btn" href="連結網址1" target="_blank">連結名稱1</a>
  <a class="link-btn" href="連結網址2" target="_blank">連結名稱2</a>
</div>

<script>
const ALLOWED_DOMAIN = "ms.tcgs.tc.edu.tw"; // 例如 "xxx.edu.tw"

function handleLogin(response) {
  const payload = parseJwt(response.credential);
  const email = payload.email;

  if (email.endsWith("@" + ALLOWED_DOMAIN)) {
    document.getElementById("login-box").style.display = "none";
    document.getElementById("content").style.display = "block";
  } else {
    document.getElementById("login-box").style.display = "none";
    document.getElementById("denied").style.display = "block";
  }
}

function parseJwt(token) {
  const base64Url = token.split('.')[1];
  const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
  const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(''));
  return JSON.parse(jsonPayload);
}
</script>

</body>
</html>
