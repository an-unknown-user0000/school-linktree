<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校內資訊連結</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B1C3B;
    --sky: #0891C4;
    --gold: #C99A0E;
    --green: #1F4023;
    --brightgreen: #6FE36C;
    --paper: #FAF6EC;
    --ink: #1A1A1A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--green);
    color: var(--ink);
    min-height: 100vh;
  }
  .banner {
    position: relative;
    height: 160px;
    overflow: hidden;
    background: var(--green);
  }
  .banner .stripe {
    position: absolute;
    top: -20%;
    width: 38%;
    height: 140%;
    transform: skewX(-18deg);
  }
  .stripe.s1 { left: 8%; background: var(--sky); }
  .stripe.s2 { left: 38%; background: var(--gold); }
  .banner h1 {
    position: relative;
    z-index: 2;
    font-family: 'Klee One', sans-serif;
    font-weight: 600;
    color: var(--paper);
    font-size: clamp(24px, 5vw, 34px);
    text-align: center;
    padding-top: 58px;
    margin: 0;
    text-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  .wrap {
    max-width: 420px;
    margin: -36px auto 0;
    padding: 0 20px 60px;
    position: relative;
    z-index: 3;
  }
  .card {
    background: var(--paper);
    border-radius: 20px;
    padding: 32px 24px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
  }
  #login-box p {
    text-align: center;
    margin: 0 0 20px;
    color: #4a4a4a;
    font-size: 15px;
  }
  #login-box { display: flex; flex-direction: column; align-items: center; }
  #denied {
    display: none;
    background: var(--paper);
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
    color: #B3261E;
    font-weight: 500;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
  }
  #content { display: none; }
  #content h2 {
    font-family: 'Klee One', sans-serif;
    font-weight: 600;
    font-size: 20px;
    margin: 0 0 20px;
    color: var(--green);
  }
  .link-btn {
    display: flex;
    align-items: center;
    background: #fff;
    padding: 16px 18px;
    margin: 0 0 14px;
    border-radius: 12px;
    text-decoration: none;
    color: var(--ink);
    font-weight: 500;
    font-size: 16px;
    border-left: 6px solid var(--sky);
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    transition: transform 0.15s ease;
  }
  .link-btn:hover { transform: translateX(3px); }
  .link-btn:nth-child(4n+1) { border-left-color: var(--sky); }
  .link-btn:nth-child(4n+2) { border-left-color: var(--gold); }
  .link-btn:nth-child(4n+3) { border-left-color: var(--brightgreen); }
  .link-btn:nth-child(4n+4) { border-left-color: var(--navy); }
</style>
</head>
<body>

<div class="banner">
  <div class="stripe s1"></div>
  <div class="stripe s2"></div>
  <h1>校內資訊連結</h1>
</div>

<div class="wrap">
  <div class="card" id="login-box">
    <p>請使用學校 Google 帳號登入</p>
    <div id="g_id_onload"
         data-client_id="708188694689-s39e3qokip8sc1gtskik0gp8334cp02q.apps.googleusercontent.com"
         data-callback="handleLogin">
    </div>
    <div class="g_id_signin" data-type="standard"></div>
  </div>

  <div id="denied">
    ⚠️ 僅限校內帳號使用，請確認你使用的是學校信箱登入
  </div>

  <div class="card" id="content">
     <h2>歡迎使用校園資訊庫^^</h2>
  <a class="link-btn" href="https://tcgs.tc.edu.tw/" target="_blank">校網</a>
  <a class="link-btn" href="https://an-unknown-user0000.github.io/school-linktree/schedule.pdf" target="_blank">課表</a>
  <a class="link-btn" href="https://itcgs.tcgs.tc.edu.tw/ischool/rfile/f40609580567a179ef93323006504f45" target="_blank">行事曆</a>
  <a class="link-btn" href="https://itcgs.tcgs.tc.edu.tw/ischool/publish_page/12/?cid=173" target="_blank">歷屆試題</a>
  <a class="link-btn" href="連結網址2" target="_blank">連結名稱2</a>

  </div>
</div>

<script>
const ALLOWED_DOMAIN = "ms.tcgs.tc.edu.tw"; // 例如 "xxx.edu.tw"

function handleLogin(response) {
  const payload = parseJwt(response.credential);
  const email = payload.email;

  if (email.endsWith("@" + ALLOWED_DOMAIN)) {
    document.getElementById("login-box").style.display = "none";
    document.getElementById("content").style.display = "block";
  } else {
    document.getElementById("login-box").style.display = "none";
    document.getElementById("denied").style.display = "block";
  }
}

function parseJwt(token) {
  const base64Url = token.split('.')[1];
  const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
  const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(''));
  return JSON.parse(jsonPayload);
}
</script>

</body>
</html>
